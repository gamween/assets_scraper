name: CI
on:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [orphan-orig, orphan-fixed, capture-orig, capture-fixed]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:inpage
      - name: run
        continue-on-error: true
        run: |
          C=tests/integration/engine/capture.test.ts
          L=tests/integration/engine/launch.test.ts
          for s in 1 2 3 4 5 6; do (while :; do :; done) & done
          case "${{ matrix.variant }}" in
            orphan-orig) F=$L; T="^withBrowser ORIG kills a browser left behind" ;;
            orphan-fixed) F=$L; T="^withBrowser kills a browser left behind" ;;
            capture-orig) F=$C; T="ORIG (keeps the bytes|reserves the per-body)" ;;
            capture-fixed) F=$C; T="^startCapture (keeps the bytes of the reads in flight|reserves the per-body cap)" ;;
          esac
          for i in $(seq 1 20); do DIAG_LAUNCH=1 npx vitest run --project integration $F -t "$T" 2>&1 | grep -E "DIAG stale|× |✓ .*(kills|keeps|reserves)|expected"; done
          kill $(jobs -p) || true
