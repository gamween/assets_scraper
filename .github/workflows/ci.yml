name: CI
on:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:inpage
      - name: run
        continue-on-error: true
        run: |
          C=tests/integration/engine/capture.test.ts
          L=tests/integration/engine/launch.test.ts
          for i in $(seq 1 14); do echo "=== iteration $i"; DIAG_LAUNCH=1 npx vitest run --project integration $C $L 2>&1 | grep -E "DIAG|× |Tests  |kills a browser left behind"; done
