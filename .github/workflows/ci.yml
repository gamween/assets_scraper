name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Production runs on Node 24 (spec section 16), so CI does too. `engines` in package.json also allows Node 22 from
# 22.19, the oldest release every dependency supports (undici sets it), and the CLI and the MCP server run on whatever
# Node the user has, so the unit tests run on that floor as well. Keep NODE_FLOOR equal to the lower bound of `engines`.
env:
  NODE_VERSION: 24
  NODE_FLOOR: 22.19.0

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build:agent
      - run: pnpm test

  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_FLOOR }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:agent
      - run: pnpm test

  # The wall-clock font benchmarks (`pnpm bench`). They read regressions the counted gate cannot, a quadratic written
  # inline over a derived array for instance, but a ratio of two timings on a shared runner flakes, so this job reports
  # and never blocks: read it when it goes red, never merge on it alone being green.
  bench:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm bench

  # No CHROME_EXECUTABLE_PATH: the runner's Chrome is at /usr/bin/google-chrome, the Linux default of
  # localExecutablePath, so this job also proves the tests find Chrome the way a contributor's machine does.
  integration:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 20
    env:
      # Test-only value, not a real secret: `next start` runs in production mode, where signing needs one.
      ASSET_URL_SECRET: ci-e2e-test-only-asset-url-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
