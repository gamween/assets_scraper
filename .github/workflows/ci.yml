name: CI
on:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome
  NO_COLOR: "1"
  FORCE_COLOR: "0"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [orphan-orig, orphan-fixed, capture-orig, capture-fixed]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:inpage
      - name: run
        continue-on-error: true
        run: |
          set +e
          C=tests/integration/engine/capture.test.ts
          L=tests/integration/engine/launch.test.ts
          case "${{ matrix.variant }}" in
            orphan-orig) F=$L; N=40; T="ORIG kills a browser left behind"; for s in 1 2 3 4 5 6; do (while :; do :; done) & done ;;
            orphan-fixed) F=$L; N=40; T="(?<!ORIG )kills a browser left behind"; for s in 1 2 3 4 5 6; do (while :; do :; done) & done ;;
            capture-orig) F=$C; N=24; T="ORIG (keeps the bytes|reserves the per-body)" ;;
            capture-fixed) F=$C; N=24; T="(?<!ORIG )(keeps the bytes of the reads in flight|reserves the per-body cap)" ;;
          esac
          for i in $(seq 1 $N); do npx vitest run --project integration $F -t "$T" > out.txt 2>&1; grep -E "Tests " out.txt; grep -E "AssertionError" out.txt | grep -v "##" ; done | sort | uniq -c
          kill $(jobs -p) 2>/dev/null
          true
