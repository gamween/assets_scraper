name: CI
on:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [full, order-proxy, split-proxy, capture-only, order-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:inpage
      - name: sampler
        run: |
          nproc; free -m; cat /proc/cpuinfo | grep "model name" | head -1
          nohup bash -c 'while true; do echo "== $(date +%T)"; ps -eo pid,ppid,pcpu,etimes,args --sort=-pcpu | head -8 | cut -c1-200; sleep 3; done' > ps.log 2>&1 &
      - name: run
        continue-on-error: true
        run: |
          C=tests/integration/engine/capture.test.ts
          L=tests/integration/engine/launch.test.ts
          E=tests/integration/engine/engine.test.ts
          AP=tests/integration/security/asset-proxy.test.ts
          EP=tests/integration/security/egress-proxy.test.ts
          case "${{ matrix.variant }}" in
            full) npx vitest run --project integration ;;
            order-proxy) ORDER=$AP,$EP,$C,$L npx vitest run -c vitest.order.config.ts $AP $EP $C $L ;;
            split-proxy) npx vitest run --project integration $AP $EP; echo "== after proxy tests"; ps -eo pid,ppid,pcpu,etimes,args --sort=-pcpu | head -15 | cut -c1-200; npx vitest run --project integration $C $L ;;
            capture-only) for i in 1 2 3; do npx vitest run --project integration $C $L; done ;;
            order-engine) ORDER=$E,$C,$L npx vitest run -c vitest.order.config.ts $E $C $L ;;
          esac
      - name: ps log
        if: always()
        run: cat ps.log | tail -400
