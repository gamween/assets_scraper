name: CI
on:
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CHROME_EXECUTABLE_PATH: /usr/bin/google-chrome

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [cmdline, orphan, inflight]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:inpage
      - name: run
        continue-on-error: true
        run: |
          C=tests/integration/engine/capture.test.ts
          L=tests/integration/engine/launch.test.ts
          case "${{ matrix.variant }}" in
            cmdline) ls -la /usr/bin/google-chrome /etc/alternatives/google-chrome; head -60 /opt/google/chrome/google-chrome; for i in 1 2 3; do node diag/cmdline.mjs; done ;;
            orphan) for i in $(seq 1 12); do npx vitest run --project integration $L -t "kills a browser left behind" 2>&1 | grep -E "Tests  |✓|×"; done ;;
            inflight) for i in $(seq 1 8); do echo "=== iteration $i"; npx vitest run --project integration $C -t "reads in flight|reserves the per-body cap" 2>&1 | grep -E "Tests  |✓|×|DIAG|expected"; done ;;
          esac
